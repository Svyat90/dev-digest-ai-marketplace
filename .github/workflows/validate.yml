name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin the CLI so a new Claude Code release cannot change validation results unannounced.
  # Bump deliberately in a dedicated PR.
  CLAUDE_CODE_VERSION: "2.1.304"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install Claude Code CLI
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Validate marketplace
        run: claude plugin validate . --strict

      - name: Validate each plugin
        run: |
          for dir in plugins/*/; do
            echo "::group::$dir"
            claude plugin validate "$dir" --strict
            echo "::endgroup::"
          done

      - name: Team checks
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/check-plugins.mjs --base "origin/${{ github.base_ref }}"
          else
            node scripts/check-plugins.mjs
          fi

      - name: Syntax-check scripts
        run: |
          for f in $(git ls-files 'scripts/*.mjs' 'plugins/*.mjs' 'plugins/*.js'); do node --check "$f"; done

      - name: Build site index
        run: node scripts/build-index.mjs --cost >> "$GITHUB_STEP_SUMMARY"

      - name: Content translations report
        # Informational: missing or stale translations never fail the build.
        run: node scripts/i18n-todo.mjs uk >> "$GITHUB_STEP_SUMMARY" || true

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Site tests (search acceptance, data, locales)
        working-directory: site
        run: npm test

      - name: Site build
        working-directory: site
        run: npm run build

  tag:
    # After merge to main, tag every plugin version that has no <plugin>--v<version> tag yet.
    # `claude plugin tag` checks that plugin.json and the marketplace entry agree.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code CLI
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Create missing release tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for dir in plugins/*/; do
            name=$(node -p "require('./${dir}.claude-plugin/plugin.json').name")
            version=$(node -p "require('./${dir}.claude-plugin/plugin.json').version")
            if git rev-parse -q --verify "refs/tags/${name}--v${version}" >/dev/null; then
              echo "${name}--v${version} exists"
              continue
            fi
            claude plugin tag "$dir" --message "${name} %s" --push
            echo "- created \`${name}--v${version}\` at \`$(git rev-parse --short HEAD)\`" >> "$GITHUB_STEP_SUMMARY"
          done
