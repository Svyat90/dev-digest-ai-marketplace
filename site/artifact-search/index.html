<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevDigest AI Marketplace</title>
  <script>
    // Artifact Search (v1) moved to the catalog: keep q and type, drop the rest.
    (function () {
      var from = new URLSearchParams(location.search);
      var to = new URLSearchParams();
      ['q', 'type'].forEach(function (k) { if (from.get(k)) to.set(k, from.get(k)); });
      var qs = to.toString();
      location.replace('../#/search' + (qs ? '?' + qs : ''));
    })();
  </script>
  <style>
    body { margin: 0; padding: 40px 16px; font: 16px/1.5 system-ui, sans-serif; background: #f6f7f9; color: #161a20; }
    @media (prefers-color-scheme: dark) { body { background: #0b0c0f; color: #e8eaef; } a { color: #8fb0ff; } }
  </style>
</head>
<body>
  <p>Artifact Search moved to the <a href="../#/search">marketplace catalog</a>.</p>
</body>
</html>
