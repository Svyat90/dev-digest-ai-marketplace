<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevDigest AI Marketplace</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>DevDigest AI Marketplace</h1>
    <p id="description">Claude Code plugins for the DevDigest team</p>
    <div class="cmd">
      <code id="add-cmd">/plugin marketplace add Svyat90/dev-digest-ai-marketplace</code>
      <button type="button" data-copy="add-cmd" aria-label="Copy add command">Copy</button>
    </div>
    <input id="filter" type="search" placeholder="Search by name, tag or component" aria-label="Search">
  </header>

  <main id="plugins" aria-live="polite"></main>

  <footer>
    <span id="commit"></span>
    · <a href="https://github.com/Svyat90/dev-digest-ai-marketplace/blob/main/CONTRIBUTING.md">Add a plugin</a>
  </footer>

  <template id="card">
    <article class="card">
      <div class="card-head">
        <h2 class="name"></h2>
        <span class="version"></span>
      </div>
      <p class="desc"></p>
      <ul class="tags"></ul>
      <ul class="components"></ul>
      <div class="cmd">
        <code class="install"></code>
        <button type="button">Copy</button>
      </div>
      <p class="meta"></p>
    </article>
  </template>

  <script src="app.js" type="module"></script>
</body>
</html>
